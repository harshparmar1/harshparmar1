
name: Generate GitHub Trophies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Profile Folder
        run: mkdir -p profile

      - name: Generate Trophies
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: 'username=harshparmar1&theme=tokyonight&column=6'
          path: profile/trophy.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Verify Trophy File
        run: |
          ls -la profile/
          test -s profile/trophy.svg
          echo "Trophy SVG generated successfully!"

      - name: Commit Trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg
          git commit -m "Add GitHub trophies" || exit 0
          git push
